# Roda a "definicao de pronto" do CLAUDE.md a cada push e pull request.
# O runner do GitHub tem Docker, entao aqui os testes de integracao sobem o Postgres de verdade
# (Testcontainers), coisa que nem toda maquina de desenvolvimento consegue.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilegio: o CI so precisa ler o codigo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore FinanceMove.sln
      - run: dotnet format FinanceMove.sln --verify-no-changes --no-restore
      - run: dotnet build FinanceMove.sln --no-restore -c Release
      - run: dotnet test FinanceMove.sln --no-build -c Release
      - name: Pacotes com vulnerabilidade conhecida
        run: |
          dotnet package list --project FinanceMove.sln --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  web:
    name: SPA (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  texto:
    name: Pontuacao ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/clean-chars.mjs --check
